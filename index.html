<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Presentación Apto 806</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
<style>
:root{--paper:#f4f4f2;--surface:#fff;--ink:#16191f;--muted:#5c6470;--line:#dcdfe2;--blue:#1e4d9b;--blue-deep:#14366f;--red:#d6262b;--font:"Archivo","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:var(--font);background:var(--paper);color:var(--ink)}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(920px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:42px;box-shadow:0 14px 38px rgba(0,0,0,.07)}
.kicker{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:12px}
h1{font-size:34px;line-height:1.1;margin:0 0 10px;color:var(--blue-deep)}
p{margin:0;color:var(--muted);font-size:16px;line-height:1.6}.rule{width:48px;height:3px;background:var(--red);margin:26px 0}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:18px}.btn{display:block;text-decoration:none;border-radius:12px;padding:28px 24px;background:var(--blue);color:#fff;font-weight:700;font-size:20px;text-align:center;transition:.15s}.btn:hover{background:var(--blue-deep);transform:translateY(-1px)}
.small{display:block;font-size:13px;font-weight:500;opacity:.82;margin-top:7px}
.footer{margin-top:28px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
@media(max-width:700px){body{padding:14px}.card{padding:26px 20px}.buttons{grid-template-columns:1fr}h1{font-size:28px}.btn{font-size:18px}}
</style>
</head>
<body>
<main class="card">
  <div class="kicker">Arquitectura &amp; Concepto</div>
  <h1>Remodelación cocina–comedor · Apto 806</h1>
  <p>Seleccione una alternativa para abrir la presentación interactiva.</p>
  <div class="rule"></div>
  <div class="buttons">
    <a class="btn" href="opcion1.html">Ver Opción 1<span class="small">Presentación interactiva</span></a>
    <a class="btn" href="opcion2.html">Ver Opción 2<span class="small">Presentación interactiva</span></a>
  </div>
  <div class="footer">Arq. Juan Carlos González D. · Arquitectura &amp; Concepto</div>
</main>
</body>
</html>
